<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">

</head>
<body>
    <body>
    <!-- 1. El encabezado: Logo y el menú de rayitas -->
    <header>
    <!-- Asegúrate de poner el nombre exacto de tu imagen con su extensión (.png o .jpg) -->
    <img src="../img/Logo.png" alt="Logo PetHouse" class="logo"> 
    <button class="menu-hamburguesa">☰</button>
</header>

    <!-- 2. Contenido principal: Textos, perro y botones -->
    <main>
        <h2>ESTÉTICA CANINA</h2>
        <h1>Cuidado y belleza para su mejor amigo</h1>
        <p>Baño, corte y estética canina con atención personalizada...</p>
        
        <img src="perro feliz.png" alt="Perro feliz">
        
        <button class="btn-principal">Reservar cita -></button>
        <a href="servicios.html" class="btn-secundario" style="display: block; text-align: center; text-decoration: none;">Ver servicios</a>
    </main>

    <!-- 3. Los beneficios (los 4 iconitos de abajo) -->
    <section class="beneficios">
        
        <div>
            <img src="paw.png" alt="Cuidado">
            <p>Cuidado profesional</p>
        </div>
        
        <div>
            <img src="shield.png" alt="Ambiente">
            <p>Ambiente seguro</p>
        </div>
        
        <div>
            <img src="heart.png" alt="Mascotas">
            <p>Mascotas felices</p>
        </div>
        
        <div>
            <img src="check.png" alt="Atención">
            <p>Atención puntual</p>
        </div>

    </section>
</body>
    
</body>
</html>
