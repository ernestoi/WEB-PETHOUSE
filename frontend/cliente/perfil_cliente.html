<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil del usuario</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/perfil_cliente.css" />
  </head>
  <body>
    <!-- Header Info-->
    <header class="content-header_perfil">
      <div class="header-title_perfil">
        <div class="content-btn_arrow">
          <i class="fa-solid fa-circle-arrow-left"></i> Regresar
        </div>
        <div class="content-title_user">
          <h1 class="title_user">Mi Perfil</h1>
        </div>
      </div>
      <div class="content-info_user">
        <div class="cont-img">
          <img src="../img/index.png" alt="Imagen del perfil del usuario." />
          <span><i class="fa-solid fa-camera"></i></span>
        </div>
        <div class="cont-info">
          <h2 class="name_user">Juan Peréz</h2>
          <p class="email_user">isaiascoca123@gmail.com</p>
          <p class="phone_user">0978926124</p>
        </div>
      </div>
    </header>

    <!-- CONTENIDO DE LAS OPCIONES-->
    <main class="content-options_user">
      <div class="personal-information user">
        <p><i class="fa-regular fa-user"></i> Mis Datos <i class="fa-solid fa-chevron-right"></i></p>
      </div>
      <div class="my-pets user">
        <p><i class="fa-solid fa-dog"></i> Mis Mascotas <i class="fa-solid fa-chevron-right"></i></p>
      </div>
      <div class="cita user">
        <p><i class="fa-regular fa-calendar-check"></i> Mis Citas <i class="fa-solid fa-chevron-right"></i></p>
      </div>
      <div class="notification_active user">
        <p><i class="fa-solid fa-bell"></i> Activar la notificación</p>
        <label class="switch">
          <input type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="help user">
        <p><i class="fa-regular fa-circle-question"></i> Ayuda <i class="fa-solid fa-chevron-right"></i></p>
      </div>
      <div class="close_sesion user">
        <p><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión <i class="fa-solid fa-chevron-right"></i></p>
      </div>
    </main>

    <!-- MENU DE LOS BOTONES DE NAVEGACION-->
    <nav class="content-menu">
      <div class="cont_btn-home btn">
        <a href="#">
          <i class="fa-regular fa-house"></i>
          <p>Inicio</p>
        </a>
      </div>
      <div class="cont_btn-services btn">
        <a href="#">
          <i class="fa-solid fa-paw"></i>
          <p>Servicios</p>
        </a>
      </div>
      <div class="cont_btn-reserve btn">
        <a href="#">
          <i class="fa-regular fa-calendar-plus"></i>
          <p>Reservar</p>
        </a>
      </div>
      <div class="cont_btn-appointments btn">
        <a href="#">
          <i class="fa-regular fa-calendar-days"></i>
          <p>Mis citas</p>
        </a>
      </div>
      <div class="cont_btn-profile btn">
        <a href="#">
          <i class="fa-solid fa-user"></i>
          <p>Mi perfil</p>
          
        </a>
      </div>
    </nav>
  </body>
</html>
