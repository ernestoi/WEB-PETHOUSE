<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contáctame</title>
    <!-- Etiqueta para el logo de la pestaña -->
    <link rel="icon" type="image/x-icon" href="../img/icon-logo.png" />
    <link rel="stylesheet" href="../css/contactanos.css" />
  </head>
  <body>
    <!-- 1. El encabezado: Logo y el menú de rayitas -->
    <header class="content-header">
      <nav class="header">
        <img src="../img/Logo.png" alt="Logo PetHouse" class="logo" />
        <ul class="list-menu">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="servicios.html">Servicio</a></li>
          <li><a href="#">Reserva tu cita</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="contacto.html">Contacto</a></li>
          <li>
            <div class="content-buttons">
              <a href="login.html" class="btn-iniciar">Iniciar Sesión</a>
              <a href="registro.html" class="btn-registrar">Registrarse</a>
            </div>
          </li>
        </ul>
        <button
          class="menu_hamburguesa"
          aria-label="Abrir menú"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </nav>

      <!-- Asegúrate de poner el nombre exacto de tu imagen con su extensión (.png o .jpg) -->
    </header>

    <main class="contenido_principal">
      <section class="header_container">
        <h1 class="title_header">Contáctanos</h1>
        <p class="details_header">
          Estamos para ayudarte a cuidar de tu mascota.
        </p>
      </section>
      <section class="contacto">
        <!-- Bloque izquierdo -->
        <div class="contacto-info">
          <h2>Hablemos de tu mascota.</h2>
          <p>
            Cuéntanos qué necesitas y te ayudaremos a encontrar la mejor opción.
          </p>

          <div class="contacto-acciones">
            <a
              href="https://wa.me/593978926124?text=Hola%2C%20me%20gustar%C3%ADa%20obtener%20informaci%C3%B3n%20sobre%20Pet%20House."
              target="_blank"
              rel="noopener noreferrer"
            >
              <i class="fa-brands fa-whatsapp"></i>
              WhatsApp
            </a>

            <a href="#"> Enviar correo </a>
          </div>

          <img src="../img/contacto.png" alt="Perro y gato" />
        </div>

        <!-- Bloque derecho -->
        <div class="contacto-formulario">
          <h2>Envíanos un mensaje</h2>

          <form id="formContacto">
            <input
              type="text"
              id="nombreContacto"
              name="nombre"
              placeholder="Nombre completo"
              maxlength="100"
              required
            />

            <input
              type="email"
              id="correoContacto"
              name="correo"
              placeholder="Correo electrónico"
              maxlength="254"
              required
            />

            <select id="motivoContacto" name="motivo" required>
              <option value="">Motivo de consulta</option>
              <option value="servicios">Consulta sobre servicios</option>
              <option value="citas">Consulta sobre citas</option>
              <option value="otro">Otro</option>
            </select>

            <textarea
              id="mensajeContacto"
              name="mensaje"
              placeholder="Escribe tu mensaje..."
              maxlength="5000"
              required
            ></textarea>

            <button type="submit" id="btnEnviarContacto">Enviar mensaje</button>

            <p id="estadoContacto" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>
    <script src="../js/main.js"></script>
    <script src="../js/contacto.js"></script>
  </body>
</html>
