<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Encabezado solo con la flecha -->
    <header class="header-registro">
        <a href="fecha-hora.html" class="btn-volver">←</a>
    </header>

    <main>
        <!-- Ícono de éxito gigante -->
        <div class="icono-exito-container">
            <div class="icono-exito">✔️</div>
        </div>

        <!-- Textos de confirmación -->
        <div class="texto-encabezado">
            <h2>¡Cita registrada!</h2>
            <p>Tu cita ha sido agendada correctamente.</p>
        </div>

        <!-- Tarjeta de Resumen -->
        <div class="tarjeta-resumen">
            <h4>Resumen de la cita</h4>
            
            <div class="fila-resumen">
                <span class="icono-resumen">📅</span>
                <span class="label-resumen">Fecha</span>
                <span class="valor-resumen">Martes, 23 de septiembre 2026</span>
            </div>
            
            <div class="fila-resumen">
                <span class="icono-resumen">🕒</span>
                <span class="label-resumen">Hora</span>
                <span class="valor-resumen">10:00 AM</span>
            </div>
            
            <div class="fila-resumen">
                <span class="icono-resumen">✂️</span>
                <span class="label-resumen">Servicio</span>
                <span class="valor-resumen">Baño + Corte</span>
            </div>
            
            <div class="fila-resumen">
                <span class="icono-resumen">🐾</span>
                <span class="label-resumen">Mascota</span>
                <span class="valor-resumen">Max</span>
            </div>
            
            <div class="fila-resumen">
                <span class="icono-resumen">👤</span>
                <span class="label-resumen">Cliente</span>
                <span class="valor-resumen">Juan Pérez</span>
            </div>
        </div>

        <!-- Botones finales -->
        <button type="button" class="btn-principal btn-wa-confirmacion">
            💬 Enviar confirmación por WhatsApp
        </button>
        
        <!-- Reutilizamos la clase del botón secundario que hicimos al principio -->
        <a href="index.html" class="btn-secundario btn-volver-inicio">Volver al inicio</a>
    </main>
</body>
</html>
