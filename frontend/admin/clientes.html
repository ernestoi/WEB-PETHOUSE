<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes — Pet's House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/vista_admin/common.css" />
    <link rel="stylesheet" href="../css/vista_admin/clientes.css" />
  </head>
  <body>
    <nav class="nav-principal">
      <ul class="nav-lista">
        <li>
          <a href="index.html" class="nav-enlace" id="nav-dashboard"
            ><i class="fas fa-tachometer-alt"></i> Dashboard</a
          >
        </li>
        <li>
          <a href="servicios.html" class="nav-enlace" id="nav-servicios"
            ><i class="fas fa-concierge-bell"></i> Servicios</a
          >
        </li>
        <li>
          <a href="clientes.html" class="nav-enlace activo" id="nav-clientes"
            ><i class="fas fa-users"></i> Clientes</a
          >
        </li>
        <li>
          <a href="citas.html" class="nav-enlace" id="nav-citas"
            ><i class="fas fa-calendar-alt"></i> Citas</a
          >
        </li>
        <li>
          <a href="perfil.html" class="nav-enlace" id="nav-perfil"
            ><i class="fas fa-user-circle"></i> Perfil</a
          >
        </li>
      </ul>
    </nav>

    <main class="contenedor">
      <header class="encabezado">
        <h1 class="encabezado__titulo" id="titulo-pagina">
          Gestión de Clientes
        </h1>
        <p class="encabezado__subtitulo" id="total-clientes">
          120 clientes registrados
        </p>
      </header>

      <!-- Buscador -->
      <section class="buscador-seccion">
        <div class="buscador" id="buscador-clientes">
          <i class="fas fa-search buscador__icono"></i>
          <input
            type="text"
            id="input-buscar"
            class="buscador__input"
            placeholder="Buscar por nombre, correo o teléfono..."
          />
        </div>
      </section>

      <!-- Lista de clientes -->
      <section class="clientes-seccion">
        <div class="lista-clientes" id="lista-clientes"></div>
      </section>
    </main>

    <!-- MODAL: EDITAR CLIENTE -->
    <div class="modal" id="modal-editar-cliente">
      <div class="modal__contenido">
        <button type="button" class="modal__cerrar" data-cerrar="editar">
          <i class="fas fa-times"></i>
        </button>

        <h2><i class="fas fa-user-edit"></i> Editar cliente</h2>

        <form id="form-editar-cliente">
          <div class="form-grupo">
            <label for="editar-nombre">Nombre completo</label>
            <input
              type="text"
              id="editar-nombre"
              class="form-input"
              maxlength="250"
              required
            />
          </div>

          <div class="form-grupo">
            <label for="editar-correo">Correo electrónico</label>
            <input
              type="email"
              id="editar-correo"
              class="form-input"
              maxlength="250"
              required
            />
          </div>

          <div class="form-grupo">
            <label for="editar-telefono">Teléfono</label>
            <input
              type="tel"
              id="editar-telefono"
              class="form-input"
              placeholder="09XXXXXXXX"
              maxlength="10"
            />
          </div>

          <div class="form-grupo">
            <label for="editar-direccion">Dirección</label>
            <input
              type="text"
              id="editar-direccion"
              class="form-input"
              placeholder="Ciudad, sector o dirección"
            />
          </div>

          <div class="modal__botones">
            <button type="button" class="btn" data-cerrar="editar">
              Cancelar
            </button>

            <button
              type="submit"
              class="btn btn--primario"
              id="btn-guardar-cliente"
            >
              <i class="fas fa-save"></i>
              Guardar cambios
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL: VISUALIZAR CLIENTE -->
    <div class="modal" id="modal-ver-cliente">
      <div class="modal__contenido">
        <button type="button" class="modal__cerrar" data-cerrar="ver">
          <i class="fas fa-times"></i>
        </button>

        <h2>
          <i class="fas fa-user-circle"></i>
          Información del cliente
        </h2>

        <div id="detalle-cliente"></div>

        <div class="modal__mascotas">
          <h3>
            <i class="fas fa-paw"></i>
            Mascotas registradas
          </h3>

          <div id="lista-mascotas-cliente"></div>
        </div>

        <div class="modal__botones">
          <button type="button" class="btn" data-cerrar="ver">Cerrar</button>
        </div>
      </div>
    </div>

    <!-- MODAL: CONFIRMAR DESACTIVACIÓN -->
    <div class="modal" id="modal-confirmar-mascota">
      <div class="modal__contenido modal__contenido--pequeno">
        <div class="modal__icono-alerta">
          <i class="fas fa-exclamation-triangle"></i>
        </div>

        <h2>Desactivar mascota</h2>

        <p id="texto-confirmacion-mascota">
          ¿Estás segura de que deseas desactivar esta mascota?
        </p>

        <div class="modal__botones">
          <button type="button" class="btn" id="cancelar-desactivacion">
            Cancelar
          </button>

          <button
            type="button"
            class="btn btn--peligro"
            id="confirmar-desactivacion"
          >
            Desactivar
          </button>
        </div>
      </div>
    </div>

    <script src="../js/admin/clientes.js"></script>
  </body>
</html>
